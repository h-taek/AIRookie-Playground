[project]
name = "Open_Duck_Playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"  # numpy 2.5.0 이 3.12 부터다

# uv.lock 을 커밋하지 않으므로 여기가 유일한 의존성 명세다.
# 따라서 범위가 아니라 정확한 버전으로 고정한다. 버전을 올릴 때는
# 이 파일을 고치고 학습 결과가 재현되는지 확인한 뒤 커밋한다.
dependencies = [
    # 물리 엔진과 수치 계산. 우리 코드가 직접 import 한다.
    # playground 의 전이 의존성으로만 들어오면 버전이 조용히 바뀌어
    # 시뮬 결과가 달라지므로 명시적으로 고정한다.
    "mujoco==3.13.0",
    "mujoco-mjx==3.13.0",
    "numpy==2.5.0",
    "scipy==1.18.0",

    # mujoco_playground 다. 배포 이름과 임포트 이름이 다르다.
    # 0.2.0 부터 Warp 백엔드를 지원한다. 0.0.3 대비 우리 코드가 쓰던 API 둘이
    # 바뀌었다 — _src.collision 모듈 삭제, mjx_env.init -> mjx_env.make_data.
    "playground==0.2.0",

    # MJWarp 백엔드. --impl warp 일 때만 실제로 쓰이지만 임포트 경로가 항상
    # 열려 있어야 하므로 플랫폼 분기 없이 건다. 실행에는 CUDA 장치가 필요하다.
    "mujoco-warp==3.13.0",
    "warp-lang==1.17.0",

    # 학습 루프가 직접 import 한다. 전이 의존성으로만 두면 상한이 없는 제약
    # (brax>=0.12.1, flax 무버전, orbax-checkpoint>=0.11.22, tensorboardx 무버전)
    # 때문에 서버에서 uv sync 하는 시점의 최신 버전이 깔린다. 그러면 ppo.train 의
    # 인자가 바뀌었을 때 즉사하거나, 안 바뀌었어도 맥과 다른 결과가 나온다.
    # 아래는 맥에서 학습이 도는 것을 확인한 버전이다.
    "brax==0.14.2",
    "flax==0.12.6",
    "orbax-checkpoint==0.12.4",
    "tensorboardX==2.6.5",
    "ml_collections==1.1.0",
    "etils==1.14.0",

    # JAX. 리눅스에서는 CUDA 빌드, 그 외(맥)에서는 CPU 빌드가 설치된다.
    # 서버에 올릴 때 이 파일을 고칠 필요가 없다.
    #
    # 0.9.2 가 상한이다. jax 0.10.0 이 jax.device_put_replicated 를 제거했는데
    # brax 0.14.2 의 ppo/train.py 가 그것을 부른다. brax 0.14.2 가 최신 배포판이라
    # 올려서 피할 수 없다. flax 도 0.12.9 부터 jax>=0.11.1 을 요구하므로 0.12.6 이
    # 상한이다. jax 를 올리려면 brax 부터 풀려야 한다.
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform != 'linux'",
    "jaxlib==0.9.2",
    "jaxtyping==0.3.11",

    # 정책 실행 및 ONNX 내보내기
    "onnxruntime==1.27.0",
    "tensorflow==2.21.0",
    "tf2onnx==1.17.0",

    # 시각화 및 입력
    "framesviewer==1.1.0",
    "matplotlib==3.11.0",
    "mediapy==1.2.6",
    "pygame==2.6.1",
]
[build-system]
requires = ["setuptools"]
[tool.setuptools]
packages = ["playground"]
